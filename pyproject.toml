[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-export"
version = "0.1.0"
description = "CLI to export Microsoft Teams chats via Microsoft Graph"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Teams Export" }
]
dependencies = [
  "typer>=0.12",
  "requests>=2.32",
  "msal>=1.28",
  "python-dateutil>=2.9"
]

[project.scripts]
teams-export = "teams_export.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-mock>=3.11",
  "freezegun>=1.2",
  "black>=23.0",
  "ruff>=0.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--verbose",
  "-ra",
  "--cov=src/teams_export",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-branch"
]

[tool.coverage.run]
source = ["src/teams_export"]
branch = true
omit = [
  "*/tests/*",
  "*/__init__.py",
  "*/teams_export/interactive.py",
  "*/teams_export/cli.py",
  "*/teams_export/auth.py",
  "*/teams_export/graph.py",
  "*/teams_export/formatters.py"
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pass"
]
fail_under = 60  # Target 60% coverage

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by black)
]
